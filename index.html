<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
    }
    #app {
      display: flex;
      height: 100vh;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #panel {
      width: 420px;
      background: #12121a;
      border-left: 1px solid #1e1e2e;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #panel-header {
      padding: 20px 20px 0;
      flex-shrink: 0;
    }
    #panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px;
    }
    #panel-footer {
      flex-shrink: 0;
      padding: 0 20px 16px;
      border-top: 1px solid #24283b;
      background: #12121a;
    }
    h1 { font-size: 1.2rem; color: #7aa2f7; letter-spacing: 2px; margin-bottom: 6px; }
    .subtitle { color: #8890b0; font-size: 0.8rem; margin-bottom: 18px; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; font-size: 0.85rem; }
    .stat { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .agent-list { display: flex; flex-direction: column; gap: 8px; }
    .section-header {
      font-size: 0.8rem; font-weight: bold; letter-spacing: 1px;
      padding: 10px 0 8px; margin-top: 10px;
      border-bottom: 1px solid #24283b;
      display: flex; justify-content: space-between; align-items: center;
    }
    .section-count {
      font-size: 0.65rem; font-weight: normal;
      padding: 1px 6px; border-radius: 8px;
    }
    .agent-card {
      background: #1a1b26;
      border: 1px solid #24283b;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
      overflow: hidden;
    }
    .agent-card.action {
      border-color: #ff9e64;
      background: #1f1a1a;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,158,100,0); }
      50% { box-shadow: 0 0 12px 2px rgba(255,158,100,0.2); }
    }
    .agent-card.selected { border-color: #7aa2f7; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .card-badge {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 8px;
      font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .badge-action { background: rgba(255,158,100,0.2); color: #ff9e64; }
    .badge-active { background: rgba(158,206,106,0.15); color: #9ece6a; }
    .card-body { cursor: pointer; }
    .card-purpose { font-size: 0.85rem; color: #c0caf5; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: all 0.2s; }
    .card-detail { font-size: 0.8rem; color: #bb9af7; margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; white-space: pre-line; transition: all 0.3s; }
    .agent-card.expanded .card-purpose { -webkit-line-clamp: unset; display: block; }
    .agent-card.expanded .card-detail { -webkit-line-clamp: unset; display: block; white-space: pre-line; word-break: break-word; max-height: 200px; overflow-y: auto; }
    .card-meta { display: flex; flex-wrap: wrap; align-items: center; font-size: 0.7rem; color: #8890b0; margin-top: 8px; gap: 6px; }
    .card-cwd { width: 100%; font-size: 0.7rem; color: #7a82a6; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-model { font-size: 0.65rem; color: #bb9af7; padding: 3px 7px; background: rgba(187,154,247,0.1); border-radius: 4px; }
    .card-warp { font-size: 0.65rem; color: #7dcfff; padding: 4px 10px; background: rgba(125,207,255,0.15); border-radius: 4px; cursor: pointer; border: 1px solid rgba(125,207,255,0.3); font-family: inherit; transition: all 0.15s; }
    .card-warp:hover { background: rgba(125,207,255,0.3); border-color: #7dcfff; color: #fff; }
    .card-project-pill { background: rgba(122,162,247,0.12); color: #7aa2f7; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; }
    .inactive-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px;
      font-size: 0.7rem; color: #565f89;
      background: #1a1b26; margin-top: 4px;
    }
    .inactive-row .dot { flex-shrink: 0; }
    .inactive-name { color: #a9b1d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .inactive-time { flex-shrink: 0; font-size: 0.6rem; }
    /* Plan usage section */
    .plan-section { margin-top: 12px; padding-top: 12px; }
    .plan-title { font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; color: #ff9e64; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .plan-meter { margin-bottom: 8px; }
    .plan-meter-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 4px; }
    .plan-meter-name { color: #c0caf5; }
    .plan-meter-value { color: #a9b1d6; }
    .plan-meter-bar { height: 8px; background: #24283b; border-radius: 4px; overflow: hidden; }
    .plan-meter-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .plan-reset { font-size: 0.65rem; color: #8890b0; margin-top: 3px; }
    .controls {
      position: fixed; top: 12px; right: 440px;
      display: flex; gap: 8px; z-index: 10;
    }
    .ctrl-btn {
      background: #1a1b26; border: 1px solid #24283b; border-radius: 6px;
      padding: 8px 14px; color: #8890b0; cursor: pointer;
      font-family: inherit; font-size: 0.8rem;
    }
    .ctrl-btn:hover { border-color: #7aa2f7; color: #7aa2f7; }
    .ctrl-btn.active { border-color: #9ece6a; color: #9ece6a; }
  </style>
</head>

// ================================================================
// SPRITE CACHE
// ================================================================
const spriteCache = new Map();
function renderSprite(data, zoom) {
  const key = data.toString() + zoom;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const h = data.length, w = data[0].length;
  const cv = new OffscreenCanvas(w * zoom, h * zoom);
  const cx = cv.getContext('2d');
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const color = data[r][c];
      if (!color) continue;
      cx.fillStyle = color;
      cx.fillRect(c * zoom, r * zoom, zoom, zoom);
    }
  }
  spriteCache.set(key, cv);
  return cv;
}

  { carpet: 'rgba(187,154,247,0.12)', border: 'rgba(187,154,247,0.3)', accent: '#bb9af7' },
  { carpet: 'rgba(224,175,104,0.12)', border: 'rgba(224,175,104,0.3)', accent: '#e0af68' },
  { carpet: 'rgba(115,218,202,0.12)', border: 'rgba(115,218,202,0.3)', accent: '#73daca' },
  { carpet: 'rgba(255,158,100,0.12)', border: 'rgba(255,158,100,0.3)', accent: '#ff9e64' },
  { carpet: 'rgba(125,207,255,0.12)', border: 'rgba(125,207,255,0.3)', accent: '#7dcfff' },
];

// ================================================================
// GAME STATE
// ================================================================
const TILE = 16;
const DESKS_PER_ROW = 3;
let zoom = 3;
let panX = 0, panY = 0;
let sessions = [];
let characters = new Map();
let zones = []; // { project, color, desks: [{col,row}], labelCol, labelRow, x, y, w, h }
let COLS = 24, ROWS = 14;
let selectedId = null;
let soundEnabled = false;
let previousStates = {};
let audioCtx = null;

// ================================================================
// LAYOUT — single open floor, desks grouped by project with carpet zones
// ================================================================
function computeLayout() {
  // Group sessions by project
  const groups = new Map();
  for (const s of sessions) {
    const key = s.project || 'unknown';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }

  // Sort projects: most agents first
  const sorted = [...groups.entries()].sort((a, b) => {
    if (b[1].length !== a[1].length) return b[1].length - a[1].length;
    return a[0].localeCompare(b[0]);
  });

  const newZones = [];
  let colorIdx = 0;

  // Place project groups sequentially on the floor
  // Each group: desks in rows of DESKS_PER_ROW, 4 tiles per desk (2 desk + 2 space)
  // Groups flow left-to-right then wrap down
  const MARGIN = 2;       // tiles margin from edge
  const GROUP_GAP = 3;    // tiles gap between groups
  const DESK_SPACING = 4; // tiles per desk slot

  // Dynamic columns: aim for a roughly square grid (cols ~= ceil(sqrt(n)))
  const totalProjects = sorted.length;
  const maxPerRow = Math.max(2, Math.ceil(Math.sqrt(totalProjects)));
  const avgZoneW = DESK_SPACING + 2;
  const WRAP_THRESHOLD = MARGIN * 2 + maxPerRow * (avgZoneW + GROUP_GAP);

  let curCol = MARGIN;
  let curRow = MARGIN + 1; // +1 for label row
  let rowMaxHeight = 0;

  for (const [project, agents] of sorted) {
    const n = agents.length;
    const desksInRow = Math.min(n, DESKS_PER_ROW);
    const deskRows = Math.ceil(n / DESKS_PER_ROW);
    const zoneW = desksInRow * DESK_SPACING;
    const zoneH = deskRows * DESK_SPACING + 1; // +1 for label

    // Wrap to next row if needed
    if (curCol + zoneW + MARGIN > WRAP_THRESHOLD && curCol > MARGIN) {
      curCol = MARGIN;
      curRow += rowMaxHeight + GROUP_GAP;
      rowMaxHeight = 0;
    }

    const zone = {
      project,
      color: ZONE_COLORS[colorIdx % ZONE_COLORS.length],
      desks: [],
      // Zone bounds in tile coords (for carpet rendering)
      x: curCol - 1,
      y: curRow - 1,
      w: zoneW + 2,
      h: zoneH + 2,
      labelCol: curCol + zoneW / 2,
      labelRow: curRow - 0.5,
      agents,
    };

    for (let i = 0; i < n; i++) {
      const dc = curCol + (i % DESKS_PER_ROW) * DESK_SPACING;
      const dr = curRow + 1 + Math.floor(i / DESKS_PER_ROW) * DESK_SPACING;
      zone.desks.push({ col: dc, row: dr });
    }

    newZones.push(zone);
    colorIdx++;

    curCol += zoneW + GROUP_GAP;
    rowMaxHeight = Math.max(rowMaxHeight, zoneH);
  }

  zones = newZones;

  // Compute total floor size
  let maxCol = 24, maxRow = 14;
  for (const z of zones) {
    maxCol = Math.max(maxCol, z.x + z.w + MARGIN);
    maxRow = Math.max(maxRow, z.y + z.h + MARGIN);
  }
  COLS = maxCol;
  ROWS = maxRow;
}

// ================================================================
// CHARACTER MANAGEMENT
// ================================================================
function createChar(session, deskCol, deskRow, idx) {
  const px = (deskCol + 1) * TILE;
  const py = (deskRow + 2) * TILE;
  return {
    id: session.id,
    palette: idx % PALETTES.length,
    x: px, y: py,
    targetX: px, targetY: py,
    deskCol, deskRow,
    state: 'type',
    frame: 0, frameTimer: 0,
    wanderTimer: 5 + Math.random() * 15,
    isActive: true,
    bubbleType: null, bubbleTimer: 0,
  };
}

function syncCharacters() {
  computeLayout();
  const activeIds = new Set(sessions.map(s => s.id));

  for (const id of characters.keys()) {
    if (!activeIds.has(id)) characters.delete(id);
  }

  let globalIdx = 0;
  for (const zone of zones) {
    for (let i = 0; i < zone.agents.length; i++) {
      const s = zone.agents[i];
      const desk = zone.desks[i];
      let ch = characters.get(s.id);
      if (!ch) {
        ch = createChar(s, desk.col, desk.row, globalIdx);
        characters.set(s.id, ch);
      }

      // Update desk (may shift if layout recalculated)
      ch.deskCol = desk.col;
      ch.deskRow = desk.row;

      const wasActive = ch.isActive;
      ch.isActive = ['working', 'thinking', 'needs_permission'].includes(s.state);

      if (ch.isActive && !wasActive) {
        ch.targetX = (ch.deskCol + 1) * TILE;
        ch.targetY = (ch.deskRow + 2) * TILE;
        ch.state = 'walk';
      }
      if (!ch.isActive && wasActive && ch.state === 'type') {
        ch.state = 'idle';
        ch.wanderTimer = 2 + Math.random() * 5;
      }

      if (s.state === 'needs_permission') {
        ch.bubbleType = 'permission';
        ch.bubbleTimer = 99;
      } else if (s.state === 'needs_input') {
        if (ch.bubbleType !== 'waiting') ch.bubbleTimer = 3;
        ch.bubbleType = 'waiting';
      } else {
        ch.bubbleType = null;
      }

      globalIdx++;
    }
  }
}

// ================================================================
// UPDATE
// ================================================================
function update(dt) {
  for (const ch of characters.values()) {
    ch.frameTimer += dt;

    if (ch.state === 'type') {
      if (ch.frameTimer > 0.3) { ch.frameTimer = 0; ch.frame = (ch.frame + 1) % 2; }
      if (!ch.isActive) { ch.state = 'idle'; ch.wanderTimer = 2 + Math.random() * 8; }
    }
    else if (ch.state === 'idle') {
      ch.frame = 0;
      if (ch.isActive) {
        ch.targetX = (ch.deskCol + 1) * TILE;
        ch.targetY = (ch.deskRow + 2) * TILE;
        ch.state = 'walk';
      } else {
        ch.wanderTimer -= dt;
        if (ch.wanderTimer <= 0) {
          // Wander freely across the whole floor
          ch.targetX = (2 + Math.random() * (COLS - 4)) * TILE;
          ch.targetY = (2 + Math.random() * (ROWS - 4)) * TILE;
          ch.state = 'walk';
          ch.wanderTimer = 5 + Math.random() * 20;
        }
      }
    }
    else if (ch.state === 'walk') {
      if (ch.frameTimer > 0.15) { ch.frameTimer = 0; ch.frame = (ch.frame + 1) % 4; }
      const dx = ch.targetX - ch.x, dy = ch.targetY - ch.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 2) {
        ch.x = ch.targetX; ch.y = ch.targetY;
        ch.state = ch.isActive ? 'type' : 'idle';
        ch.frame = 0;
      } else {
        const speed = 48 * dt;
        ch.x += (dx / dist) * speed;
        ch.y += (dy / dist) * speed;
      }
    }

    if (ch.bubbleType === 'waiting') {
      ch.bubbleTimer -= dt;
      if (ch.bubbleTimer <= 0) ch.bubbleType = null;
    }
  }
}

// ================================================================
// RENDER
// ================================================================
function render(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const mapW = COLS * TILE * zoom;
  const mapH = ROWS * TILE * zoom;
  const ox = Math.floor((w - mapW) / 2) + panX;
  const oy = Math.floor((h - mapH) / 2) + panY;

  // Main floor
  ctx.fillStyle = '#1e1e2e';
  ctx.fillRect(ox, oy, mapW, mapH);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(ox + c * TILE * zoom + 0.5, oy);
    ctx.lineTo(ox + c * TILE * zoom + 0.5, oy + mapH);
    ctx.stroke();
  }
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(ox, oy + r * TILE * zoom + 0.5);
    ctx.lineTo(ox + mapW, oy + r * TILE * zoom + 0.5);
    ctx.stroke();
  }

  // Draw project zone carpets
  for (const zone of zones) {
    const zx = ox + zone.x * TILE * zoom;
    const zy = oy + zone.y * TILE * zoom;
    const zw = zone.w * TILE * zoom;
    const zh = zone.h * TILE * zoom;

    // Carpet fill
    ctx.fillStyle = zone.color.carpet;
    ctx.fillRect(zx, zy, zw, zh);

    // Carpet border (dashed)
    ctx.strokeStyle = zone.color.border;
    ctx.lineWidth = 2;
    ctx.setLineDash([zoom * 3, zoom * 2]);
    ctx.strokeRect(zx + 1, zy + 1, zw - 2, zh - 2);
    ctx.setLineDash([]);

    // Project label at top of zone
    const labelX = ox + zone.labelCol * TILE * zoom;
    const labelY = oy + zone.labelRow * TILE * zoom;
    ctx.font = `bold ${Math.max(11, zoom * 4)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = zone.project.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const tw = ctx.measureText(text).width;
    // Label background pill
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    const pillH = Math.max(16, zoom * 5);
    ctx.beginPath();
    ctx.roundRect(labelX - tw / 2 - 8, labelY - pillH / 2, tw + 16, pillH, pillH / 3);
    ctx.fill();
    // Label text
    ctx.fillStyle = zone.color.accent;
    ctx.fillText(text, labelX, labelY);

    // Agent count
    ctx.font = `${Math.max(8, zoom * 2.5)}px Courier New`;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillText(`${zone.agents.length} agent${zone.agents.length !== 1 ? 's' : ''}`, labelX, labelY + pillH / 2 + Math.max(8, zoom * 2));
  }

  // Collect drawables for z-sort
  const drawables = [];

  // Desks + PCs
  for (const ch of characters.values()) {
    const deskSprite = renderSprite(DESK, zoom);
    const pcSprite = renderSprite(PC, zoom);
    const dx = ox + ch.deskCol * TILE * zoom;
    const dy = oy + ch.deskRow * TILE * zoom;
    drawables.push({ zY: ch.deskRow * TILE + 32, draw: () => ctx.drawImage(deskSprite, dx, dy) });
    const px = ox + (ch.deskCol + 0.5) * TILE * zoom;
    const py = oy + (ch.deskRow + 0.25) * TILE * zoom;
    drawables.push({ zY: ch.deskRow * TILE + 8, draw: () => ctx.drawImage(pcSprite, px, py) });
  }

  // Characters
  for (const ch of characters.values()) {
    const pal = PALETTES[ch.palette];
    let tpl;
    if (ch.state === 'type') {
      tpl = ch.frame === 0 ? TD1 : TD2;
    } else if (ch.state === 'walk') {
      tpl = [WD1, WD2, WD1, WD2][ch.frame % 4];
    } else {
      tpl = WD2;
    }
    const sprite = renderSprite(resolve(tpl, pal), zoom);
    const sittingOff = ch.state === 'type' ? 6 : 0;
    const sx = Math.round(ox + ch.x * zoom - sprite.width / 2);
    const sy = Math.round(oy + (ch.y + sittingOff) * zoom - sprite.height);

    drawables.push({
      zY: ch.y + TILE / 2,
      draw: () => {
        ctx.drawImage(sprite, sx, sy);

        const labelX = ox + ch.x * zoom;
        const labelY = oy + (ch.y + sittingOff - 26) * zoom;
        const session = sessions.find(s => s.id === ch.id);
        if (session) {
          let dotColor = 'transparent';
          if (['needs_input','needs_permission'].includes(session.state)) dotColor = '#ff9e64';
          else if (session.state === 'working') dotColor = '#9ece6a';
          else if (session.state === 'thinking') dotColor = '#7aa2f7';
          else if (session.state === 'completed') dotColor = '#73daca';

          if (dotColor !== 'transparent') {
            ctx.fillStyle = dotColor;
            ctx.beginPath();
            ctx.arc(labelX, labelY - 4, 3 * (zoom / 3), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.font = `${Math.max(9, zoom * 3)}px Courier New`;
          const text = session.slug || session.id;
          const tw = ctx.measureText(text).width;
          ctx.fillStyle = 'rgba(30,30,46,0.85)';
          ctx.fillRect(labelX - tw / 2 - 3, labelY - 6, tw + 6, Math.max(12, zoom * 4));
          ctx.fillStyle = '#c0caf5';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(text, labelX, labelY - 4);
        }
      }
    });

    if (ch.bubbleType) {
      const bSprite = renderSprite(ch.bubbleType === 'permission' ? BUBBLE_PERM : BUBBLE_CHECK, zoom);
      const bx = Math.round(ox + ch.x * zoom - bSprite.width / 2);
      const by = Math.round(oy + (ch.y + sittingOff - 28) * zoom - bSprite.height);
      drawables.push({
        zY: ch.y - 100,
        draw: () => {
          let alpha = 1;
          if (ch.bubbleType === 'waiting' && ch.bubbleTimer < 0.5) alpha = ch.bubbleTimer / 0.5;
          if (alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
          ctx.drawImage(bSprite, bx, by);
          if (alpha < 1) ctx.globalAlpha = 1;
        }
      });
    }
  }

  drawables.sort((a, b) => a.zY - b.zY);
  for (const d of drawables) d.draw();

  // Empty state
  if (zones.length === 0) {
    ctx.fillStyle = '#565f89';
    ctx.font = '16px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No hay agentes activos', w / 2, h / 2);
    ctx.font = '12px Courier New';
    ctx.fillText('Abre Claude Code en una terminal para comenzar', w / 2, h / 2 + 24);
  }
}

// ================================================================
// GAME LOOP
// ================================================================
const canvas = document.getElementById('c');
const wrap = document.getElementById('canvas-wrap');
let lastTime = 0;

function gameLoop(time) {
  const dt = lastTime === 0 ? 0 : Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  const dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  update(dt);
  render(ctx, canvas.width, canvas.height);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// ================================================================
// UI — Side panel
// ================================================================
const STATE_LABELS = {
  needs_input: 'NECESITA INPUT', needs_permission: 'APROBACION',
  completed: 'COMPLETADO', working: 'TRABAJANDO',
  thinking: 'PENSANDO', offline: 'OFFLINE',
};
const STATE_COLORS = {
  needs_input: '#ff9e64', needs_permission: '#ff9e64',
  completed: '#73daca', working: '#9ece6a',
  thinking: '#7aa2f7', offline: '#565f89',
};

function timeAgo(ts) {
  if (!ts) return '';
  const d = Date.now() - new Date(ts).getTime();
  const m = Math.floor(d / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  return `${Math.floor(h/24)}d`;
}

function renderPanel() {
  const stats = document.getElementById('stats');
  const list = document.getElementById('list');

  document.getElementById('total').textContent = sessions.length;

  // Categorize
  const needAction = sessions.filter(s => s.state === 'needs_input' || s.state === 'needs_permission');

  const inactive = sessions.filter(s => s.state === 'completed' || s.state === 'offline');

  // Stats bar
  const parts = [];
  if (needAction.length) parts.push(`<span class="stat"><span class="dot" style="background:#ff9e64"></span>${needAction.length} accion</span>`);
  if (active.length) parts.push(`<span class="stat"><span class="dot" style="background:#9ece6a"></span>${active.length} activo${active.length>1?'s':''}</span>`);
  if (inactive.length) parts.push(`<span class="stat"><span class="dot" style="background:#565f89"></span>${inactive.length} inactivo${inactive.length>1?'s':''}</span>`);
  stats.innerHTML = parts.join('');

  let html = '';

  // ── NEED ACTION section ──
  if (needAction.length) {
    html += `<div class="section-header" style="color:#ff9e64;">
      NECESITAN ACCION
      <span class="section-count" style="background:rgba(255,158,100,0.2);color:#ff9e64;">${needAction.length}</span>
    </div>`;
    for (const s of needAction) {
      const badge = s.state === 'needs_permission' ? 'APROBACION' : 'INPUT';
      html += `
        <div class="agent-card action" style="margin-top:8px;">
          <div class="card-top">
            <span class="card-project-pill">${s.project}</span>
            <span class="card-badge badge-action">${badge}</span>
          </div>
          <div class="card-body" onclick="toggleExpand('${s.id}', event)">

            <div class="card-detail">${s.detail || ''}</div>

            ${s.model ? `<span class="card-model">${s.model}</span>` : ''}<button class="card-warp" onclick="event.stopPropagation();focusTerminal('${s.cwd}')">▸ Abrir en iTerm</button>
            <span>${timeAgo(s.lastActivity)}</span>
            <div class="card-cwd">${s.cwd || ''}</div>
          </div>
        </div>`;
    }
  }

  // ── ACTIVE section ──
  if (active.length) {
    html += `<div class="section-header" style="color:#9ece6a;">
      ACTIVOS
      <span class="section-count" style="background:rgba(158,206,106,0.15);color:#9ece6a;">${active.length}</span>
    </div>`;
    for (const s of active) {
      const badge = s.state === 'thinking' ? 'PENSANDO' : 'TRABAJANDO';
      html += `
        <div class="agent-card" style="margin-top:8px;">
          <div class="card-top">
            <span class="card-project-pill">${s.project}</span>
            <span class="card-badge badge-active">${badge}</span>
          </div>
          <div class="card-body" onclick="toggleExpand('${s.id}', event)">
            <div class="card-purpose">${s.purpose || 'Sin contexto'}</div>
            <div class="card-detail">${s.detail || ''}</div>
          </div>
          <div class="card-meta">
            ${s.model ? `<span class="card-model">${s.model}</span>` : ''}<button class="card-warp" onclick="event.stopPropagation();focusTerminal('${s.cwd}')">▸ Abrir en iTerm</button>
            <span>${timeAgo(s.lastActivity)}</span>
            <div class="card-cwd">${s.cwd || ''}</div>
          </div>
        </div>`;
    }
  }

  // ── INACTIVE section ──
  if (inactive.length) {
    html += `<div class="section-header" style="color:#8890b0;">
      INACTIVOS
      <span class="section-count" style="background:rgba(86,95,137,0.15);color:#8890b0;">${inactive.length}</span>
    </div>`;
    for (const s of inactive) {
      const badge = s.state === 'completed' ? 'COMPLETADO' : 'OFFLINE';
      const badgeColor = s.state === 'completed' ? '#73daca' : '#565f89';
      html += `
        <div class="agent-card" style="margin-top:8px;opacity:0.7;">
          <div class="card-top">
            <span class="card-project-pill">${s.project}</span>
            <span class="card-badge" style="background:rgba(86,95,137,0.15);color:${badgeColor}">${badge}</span>
          </div>
          <div class="card-body" onclick="toggleExpand('${s.id}', event)">
            <div class="card-purpose">${s.purpose || 'Sin contexto'}</div>
            <div class="card-detail">${s.detail || ''}</div>
          </div>
          <div class="card-meta">
            ${s.model ? `<span class="card-model">${s.model}</span>` : ''}<button class="card-warp" onclick="event.stopPropagation();focusTerminal('${s.cwd}')">▸ Abrir en iTerm</button>
            <span>${timeAgo(s.lastActivity)}</span>
            <div class="card-cwd">${s.cwd || ''}</div>
          </div>
        </div>`;
    }
  }

  // Empty state
  if (sessions.length === 0) {
    html = '<div style="color:#8890b0;font-size:0.75rem;text-align:center;padding:40px 0;">Sin agentes activos</div>';
  }

  list.innerHTML = html;
}

function selectAgent(id) { selectedId = selectedId === id ? null : id; renderPanel(); }

// ================================================================
// PLAN USAGE (claude.ai)
// ================================================================
function timeUntil(isoDate) {
  if (!isoDate) return '';
  const diff = new Date(isoDate).getTime() - Date.now();
  if (diff <= 0) return 'ahora';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 24) return `${Math.floor(h / 24)}d ${h % 24}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function meterColor(pct) {
  if (pct >= 80) return '#f7768e';
  if (pct >= 50) return '#ff9e64';
  if (pct >= 25) return '#e0af68';
  return '#9ece6a';
}

function renderPlanUsage(data) {
  const el = document.getElementById('plan-usage');
  if (!data || data.error) {
    if (data?.error?.includes('Missing')) {
      el.innerHTML = `<div class="plan-title">PLAN CLAUDE.AI</div>
        <div style="font-size:0.65rem;color:#8890b0;padding:8px;">Configura CLAUDE_COOKIE en .env</div>`;
    } else {
      el.innerHTML = '';
    }
    return;
  }

  const meters = [
    { key: 'five_hour', label: 'Limite 5 horas', data: data.five_hour },
    { key: 'seven_day', label: 'Limite 7 dias', data: data.seven_day },
    { key: 'seven_day_sonnet', label: 'Sonnet (7 dias)', data: data.seven_day_sonnet },
    { key: 'seven_day_opus', label: 'Opus (7 dias)', data: data.seven_day_opus },
    { key: 'seven_day_cowork', label: 'Cowork (7 dias)', data: data.seven_day_cowork },
  ];

  let html = `<div class="plan-title">
    PLAN CLAUDE.AI
    <span style="font-size:0.55rem;font-weight:normal;color:#8890b0;">en vivo</span>
  </div>`;

  for (const m of meters) {
    if (!m.data) continue;
    const pct = Math.min(100, Math.round(m.data.utilization));
    const color = meterColor(pct);
    const reset = m.data.resets_at ? `Reset en ${timeUntil(m.data.resets_at)}` : '';
    html += `
      <div class="plan-meter">
        <div class="plan-meter-label">
          <span class="plan-meter-name">${m.label}</span>
          <span class="plan-meter-value" style="color:${color}">${pct}%</span>
        </div>
        <div class="plan-meter-bar">
          <div class="plan-meter-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        ${reset ? `<div class="plan-reset">${reset}</div>` : ''}
      </div>`;
  }

  // Extra usage
  if (data.extra_usage) {
    const eu = data.extra_usage;
    html += `<div style="font-size:0.6rem;color:#8890b0;margin-top:6px;padding:4px 0;border-top:1px solid #24283b;">
      Extra usage: ${eu.is_enabled ? 'Activado' : 'Desactivado'}
      ${eu.used_credits != null ? ` — $${eu.used_credits.toFixed(2)} usado` : ''}
    </div>`;
  }

  el.innerHTML = html;
}

function fetchPlanUsage() {
  fetch('/api/plan-usage').then(r => r.json()).then(renderPlanUsage).catch(() => {});
}
fetchPlanUsage();
setInterval(fetchPlanUsage, 60000);

function focusTerminal(cwd) {
  fetch('/api/focus-terminal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cwd }),
  }).catch(() => {});
}

function updateCookie() {
  const cookie = prompt('Pega el cookie de claude.ai (Request Headers → Cookie):');
  if (!cookie) return;
  fetch('/api/update-cookie', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cookie }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      fetchPlanUsage();
    } else {
      alert('Error: ' + (data.error || 'desconocido'));
    }
  })
  .catch(() => alert('Error de conexion'));
}


// ================================================================
// NOTIFICATIONS
// ================================================================
function playChime() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const play = (freq, start) => {
      const t = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.18);
    };
    play(659.25, 0); play(1318.51, 0.1);
  } catch {}
}

function checkNotifications() {
  for (const s of sessions) {
    const prev = previousStates[s.id];
    if ((s.state === 'needs_input' || s.state === 'needs_permission') && prev !== s.state) {
      playChime();
    }
    previousStates[s.id] = s.state;
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('soundEnabled', soundEnabled);
  const btn = document.getElementById('soundBtn');
  btn.textContent = `Sonido: ${soundEnabled ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active', soundEnabled);
  if (soundEnabled && !audioCtx) audioCtx = new AudioContext();
}

// Restore sound preference
if (localStorage.getItem('soundEnabled') === 'true') {
  soundEnabled = true;
  const btn = document.getElementById('soundBtn');
  btn.textContent = 'Sonido: ON';
  btn.classList.add('active');
}

function changeZoom(d) {
  zoom = Math.max(1, Math.min(8, zoom + d));
  spriteCache.clear();
}

// ================================================================
// DATA — WebSocket + polling
// ================================================================
function onData(data) {
  sessions = data;
  syncCharacters();
  checkNotifications();
  renderPanel();
}

function wsConnect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.type==='update') onData(d.sessions); } catch{} };
  ws.onclose = () => setTimeout(wsConnect, 2000);
  ws.onerror = () => ws.close();
}

fetch('/api/sessions').then(r=>r.json()).then(onData).catch(()=>{});
wsConnect();
setInterval(() => fetch('/api/sessions').then(r=>r.json()).then(onData).catch(()=>{}), 5000);

// Pan with mouse drag
let dragging = false, dragStart = { x: 0, y: 0 };
canvas.addEventListener('mousedown', e => { dragging = true; dragStart = { x: e.clientX - panX, y: e.clientY - panY }; });
window.addEventListener('mousemove', e => { if (dragging) { panX = e.clientX - dragStart.x; panY = e.clientY - dragStart.y; } });
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); changeZoom(e.deltaY < 0 ? 1 : -1); }, { passive: false });
</script>
