// ================================================================

// Type 2: Cap/beanie — hat on top of head
const NUM_BODY_TYPES = 3;

// Clone a template and apply head modifications
function cloneTemplate(tpl) { return tpl.map(r => [...r]); }

// Long hair variants: extend hair down beside the face
function makeLongHair(tpl) {
  const t = cloneTemplate(tpl);
  // Find where hair starts (first row with H)
  for (let r = 0; r < t.length; r++) {
    if (t[r].includes(H)) {
      // Add hair strands on sides of face rows (skin rows below hair)
      for (let fr = r + 3; fr < Math.min(r + 8, t.length); fr++) {
        if (t[fr][4] === _ && (t[fr][5] === K || t[fr][5] === S || t[fr][5] === _)) t[fr][4] = H;
        if (t[fr][11] === _ && (t[fr][10] === K || t[fr][10] === S || t[fr][10] === _)) t[fr][11] = H;
      }
      break;
    }
  }
  return t;
}

// Cap variants: add a cap/visor above the hair
function makeCap(tpl) {
  const t = cloneTemplate(tpl);
  const G = '#hat'; // Will be resolved to shirt color (matching outfit)
  // Find first hair row
  for (let r = 0; r < t.length; r++) {
    if (t[r].includes(H)) {
      // Replace top hair row with cap and add visor above
      if (r > 0) {
        // Cap brim (wider than head)
        t[r - 1] = t[r - 1].map((c, i) => (i >= 4 && i <= 12) ? G : c);
      }
      // Cap top rows (replace hair)
      t[r] = t[r].map((c, i) => c === H ? G : c);
      if (r + 1 < t.length) {
        t[r + 1] = t[r + 1].map((c, i) => c === H ? G : c);
      }
      break;
    }
  }
  return t;
}

// Resolve with hat color mapped to shirt
function resolveVariant(tpl, pal) {
  return tpl.map(r => r.map(c => {
    if (c === _) return '';
    if (c === E) return E;
    if (c === '#hat') return pal[S]; // cap matches shirt color
    return pal[c] || c;
  }));
}

// Decoration placement (computed after layout)
let decorations = []; // [{type, col, row, sprite}]

function placeDecorations() {
  decorations = [];
  if (zones.length === 0) return;

  // Use a seeded random for consistent placement
  let seed = zones.length * 7 + COLS * 13 + ROWS * 3;
  const rand = () => { seed = (seed * 16807 + 0) % 2147483647; return (seed - 1) / 2147483646; };

  const occupied = new Set();
  // Mark zone areas and desks as occupied
  for (const z of zones) {
    for (let r = z.y; r < z.y + z.h; r++) {
      for (let c = z.x; c < z.x + z.w; c++) {
        occupied.add(`${c},${r}`);
      }
    }
  }

  const smallDecorSprites = [
    { sprite: PLANT, w: 1, h: 1, wallOnly: false },
    { sprite: COOLER, w: 1, h: 1, wallOnly: false },
    { sprite: BOOKSHELF, w: 1, h: 1, wallOnly: true },
  ];

  const bigDecorSprites = [
    { sprite: PING_PONG, w: 2, h: 2 },
    { sprite: POOL_TABLE, w: 2, h: 2 },
  ];

  // Place whiteboards along top wall (row 1, needs 2 tiles wide)
  const wbCandidates = [];
  for (let c = 1; c < COLS - 2; c++) {
    if (!occupied.has(`${c},1`) && !occupied.has(`${c+1},1`)) {
      wbCandidates.push(c);
    }
  }
  // Place up to 2 whiteboards
  for (let i = 0; i < Math.min(2, wbCandidates.length); i++) {
    const idx = Math.floor(rand() * wbCandidates.length);
    const c = wbCandidates.splice(idx, 1)[0];
    decorations.push({ type: 'whiteboard', col: c, row: 1, sprite: WHITEBOARD, w: 2, h: 1 });
    occupied.add(`${c},1`);
    occupied.add(`${c+1},1`);
    // Remove adjacent candidates
    const remove = wbCandidates.indexOf(c - 1);
    if (remove >= 0) wbCandidates.splice(remove, 1);
    const remove2 = wbCandidates.indexOf(c + 1);
    if (remove2 >= 0) wbCandidates.splice(remove2, 1);
  }

  // Place big tables (ping pong, pool) — need 2x2 free space away from zones
  function canPlace2x2(c, r) {
    for (let dr = 0; dr < 2; dr++) {
      for (let dc = 0; dc < 2; dc++) {
        if (occupied.has(`${c+dc},${r+dr}`)) return false;
        if (c+dc >= COLS - 1 || r+dr >= ROWS - 1) return false;
        if (c+dc <= 0 || r+dr <= 0) return false;
      }
    }
    return true;
  }

  const bigCandidates = [];
  for (let r = 2; r < ROWS - 3; r++) {
    for (let c = 2; c < COLS - 3; c++) {
      if (canPlace2x2(c, r)) bigCandidates.push({ col: c, row: r });
    }
  }
  // Shuffle big candidates
  for (let i = bigCandidates.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [bigCandidates[i], bigCandidates[j]] = [bigCandidates[j], bigCandidates[i]];
  }

  // Place up to 1 big table (only if enough room — at least 2 zones)
  const numBigTables = zones.length >= 2 && bigCandidates.length > 0 ? 1 : 0;
  for (let i = 0; i < numBigTables; i++) {
    const spot = bigCandidates[i];
    const decor = bigDecorSprites[Math.floor(rand() * bigDecorSprites.length)];
    decorations.push({ type: 'bigtable', col: spot.col, row: spot.row, sprite: decor.sprite, w: 2, h: 2 });
    for (let dr = 0; dr < 2; dr++) {
      for (let dc = 0; dc < 2; dc++) {
        occupied.add(`${spot.col+dc},${spot.row+dr}`);
      }
    }
  }

  // Place small decorations along walls and in corners
  const candidates = [];
  for (let r = 1; r < ROWS - 1; r++) {
    for (let c = 1; c < COLS - 1; c++) {
      if (!occupied.has(`${c},${r}`)) {
        const isWallAdjacent = r <= 2 || r >= ROWS - 2 || c <= 1 || c >= COLS - 2;
        candidates.push({ col: c, row: r, wallAdj: isWallAdjacent });
      }
    }
  }

  // Shuffle and place decorations
  const numDecorations = Math.min(Math.floor(2 + zones.length * 1.5), candidates.length, 12);
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  // Prefer wall-adjacent spots first
  candidates.sort((a, b) => (b.wallAdj ? 1 : 0) - (a.wallAdj ? 1 : 0));

  let placed = 0;
  for (const spot of candidates) {
    if (placed >= numDecorations) break;
    const decor = smallDecorSprites[Math.floor(rand() * smallDecorSprites.length)];
    if (decor.wallOnly && !spot.wallAdj) continue;
    decorations.push({ type: 'decor', col: spot.col, row: spot.row, sprite: decor.sprite, w: decor.w, h: decor.h });
    occupied.add(`${spot.col},${spot.row}`);
    placed++;
  }
}

// ================================================================
// MATRIX SPAWN/DESPAWN EFFECT
// ================================================================
const MATRIX_DURATION = 0.3;
const MATRIX_TRAIL_LENGTH = 6;
const MATRIX_HEAD_COLOR = '#ccffcc';
const MATRIX_TRAIL_COLORS = [
  'rgba(0,255,65,0.7)', 'rgba(0,255,65,0.55)', 'rgba(0,200,40,0.4)',
  'rgba(0,170,30,0.3)', 'rgba(0,120,20,0.2)', 'rgba(0,85,15,0.1)',
];

function matrixFlicker(col, row, time) {
  const hash = (col * 7 + row * 13 + Math.floor(time * 20) * 3) & 0xFF;
  return hash > 77;
}

function renderMatrixEffect(ctx, ch, ox, oy, zoom) {
  const pal = PALETTES[ch.palette];
  const bt = BODY_TYPES[ch.bodyType] || BODY_TYPES[0];
  const tpl = ch.state === 'type' ? bt.type1 : bt.walk2;
  const data = resolveVariant(tpl, pal);
  const rows = data.length, cols = data[0].length;
  const progress = Math.min(ch.matrixEffectTimer / MATRIX_DURATION, 1);
  const isSpawn = ch.matrixEffect === 'spawn';
  const sittingOff = ch.state === 'type' ? 6 : 0;
  const baseX = Math.round(ox + ch.x * zoom - (cols * zoom) / 2);
  const baseY = Math.round(oy + (ch.y + sittingOff) * zoom - rows * zoom);

  for (let c = 0; c < cols; c++) {
    const stagger = ch.matrixEffectSeeds[c % ch.matrixEffectSeeds.length];
    const colProgress = Math.max(0, Math.min((progress - stagger) / (1 - stagger), 1));
    const headRow = Math.floor(colProgress * (rows + MATRIX_TRAIL_LENGTH));

    for (let r = 0; r < rows; r++) {
      const px = baseX + c * zoom;
      const py = baseY + r * zoom;
      const color = data[r][c];
      const distFromHead = headRow - r;

      if (isSpawn) {
        // Spawn: head sweeps down, revealing character above
        if (r < headRow - MATRIX_TRAIL_LENGTH && color) {
          // Revealed: show actual sprite pixel
          if (matrixFlicker(c, r, ch.matrixEffectTimer)) {
            ctx.fillStyle = color;
            ctx.fillRect(px, py, zoom, zoom);
          }
        } else if (distFromHead >= 0 && distFromHead <= MATRIX_TRAIL_LENGTH) {
          // Trail/head zone
          if (distFromHead === 0) {
            ctx.fillStyle = MATRIX_HEAD_COLOR;
          } else {
            ctx.fillStyle = MATRIX_TRAIL_COLORS[Math.min(distFromHead - 1, MATRIX_TRAIL_COLORS.length - 1)];
          }
          if (matrixFlicker(c, r, ch.matrixEffectTimer)) {
            ctx.fillRect(px, py, zoom, zoom);
          }
        }
      } else {
        // Despawn: head sweeps down, consuming character
        if (r >= headRow - MATRIX_TRAIL_LENGTH && r < headRow && color) {
          // Trail overlays remaining sprite
          const trailIdx = headRow - r - 1;
          ctx.fillStyle = MATRIX_TRAIL_COLORS[Math.min(trailIdx, MATRIX_TRAIL_COLORS.length - 1)];
          if (matrixFlicker(c, r, ch.matrixEffectTimer)) {
            ctx.fillRect(px, py, zoom, zoom);
          }
        } else if (r === headRow) {
          ctx.fillStyle = MATRIX_HEAD_COLOR;
          if (matrixFlicker(c, r, ch.matrixEffectTimer)) {
            ctx.fillRect(px, py, zoom, zoom);
          }
        } else if (r > headRow && color) {
          // Below head: still visible
          ctx.fillStyle = color;
          ctx.fillRect(px, py, zoom, zoom);
        }
      }
    }
  }
}

const spriteCache = new Map();
function renderSprite(data, zoom) {
  const key = data.toString() + zoom;
  if (spriteCache.has(key)) return spriteCache.get(key);
  const h = data.length, w = data[0].length;
  const cv = new OffscreenCanvas(w * zoom, h * zoom);
  const cx = cv.getContext('2d');
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const color = data[r][c];
      if (!color) continue;
      cx.fillStyle = color;
      cx.fillRect(c * zoom, r * zoom, zoom, zoom);
    }
  }
  spriteCache.set(key, cv);
  return cv;
}

// ================================================================
// LAYOUT — single open floor, desks grouped by project with carpet zones
// ================================================================
function computeLayout() {
  // Group sessions by project
  const groups = new Map();
  for (const s of sessions) {
    const key = s.project || 'unknown';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }

  // Sort projects: most agents first
  const sorted = [...groups.entries()].sort((a, b) => {
    if (b[1].length !== a[1].length) return b[1].length - a[1].length;
    return a[0].localeCompare(b[0]);
  });

  const newZones = [];
  let colorIdx = 0;

  // Place project groups sequentially on the floor
  // Each group: desks in rows of DESKS_PER_ROW, 4 tiles per desk (2 desk + 2 space)
  // Groups flow left-to-right then wrap down
  const MARGIN = 2;       // tiles margin from edge
  const GROUP_GAP = 3;    // tiles gap between groups
  const DESK_SPACING = 4; // tiles per desk slot

  // Dynamic columns: aim for a roughly square grid (cols ~= ceil(sqrt(n)))
  const totalProjects = sorted.length;
  const maxPerRow = Math.max(2, Math.ceil(Math.sqrt(totalProjects)));
  const avgZoneW = DESK_SPACING + 2;
  const WRAP_THRESHOLD = MARGIN * 2 + maxPerRow * (avgZoneW + GROUP_GAP);

  let curCol = MARGIN;
  let curRow = MARGIN + 1; // +1 for label row
  let rowMaxHeight = 0;

  for (const [project, agents] of sorted) {
    const n = agents.length;
    const desksInRow = Math.min(n, DESKS_PER_ROW);
    const deskRows = Math.ceil(n / DESKS_PER_ROW);
    const zoneW = desksInRow * DESK_SPACING;
    const zoneH = deskRows * DESK_SPACING + 1; // +1 for label

    // Wrap to next row if needed
    if (curCol + zoneW + MARGIN > WRAP_THRESHOLD && curCol > MARGIN) {
      curCol = MARGIN;
      curRow += rowMaxHeight + GROUP_GAP;
      rowMaxHeight = 0;
    }

    const zone = {
      project,
      color: ZONE_COLORS[colorIdx % ZONE_COLORS.length],
      desks: [],
      // Zone bounds in tile coords (for carpet rendering)
      x: curCol - 1,
      y: curRow - 1,
      w: zoneW + 2,
      h: zoneH + 2,
      labelCol: curCol + zoneW / 2,
      labelRow: curRow - 0.5,
      agents,
    };

    for (let i = 0; i < n; i++) {
      const dc = curCol + (i % DESKS_PER_ROW) * DESK_SPACING;
      const dr = curRow + 1 + Math.floor(i / DESKS_PER_ROW) * DESK_SPACING;
      zone.desks.push({ col: dc, row: dr });
    }

    newZones.push(zone);
    colorIdx++;

    curCol += zoneW + GROUP_GAP;
    rowMaxHeight = Math.max(rowMaxHeight, zoneH);
  }

  zones = newZones;

  // Compute total floor size
  let maxCol = 24, maxRow = 14;
  for (const z of zones) {
    maxCol = Math.max(maxCol, z.x + z.w + MARGIN);
    maxRow = Math.max(maxRow, z.y + z.h + MARGIN);
  }
  COLS = maxCol;
  ROWS = maxRow;
}

// ================================================================
// WALKABILITY GRID & BFS PATHFINDING
// ================================================================
let tileWalkable = [];

function buildWalkabilityGrid() {
  tileWalkable = Array.from({length: ROWS}, () => Array(COLS).fill(true));
  // Block wall tiles (row 0 and col 0)
  for (let c = 0; c < COLS; c++) tileWalkable[0][c] = false;
  for (let r = 0; r < ROWS; r++) tileWalkable[r][0] = false;
  // Block desk areas
  for (const ch of characters.values()) {
    for (let dr = 0; dr < 2; dr++) {
      for (let dc = 0; dc < 2; dc++) {
        const c = ch.deskCol + dc, r = ch.deskRow + dr;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          tileWalkable[r][c] = false;
        }
      }
    }
  }
  // Block decoration tiles
  for (const d of decorations) {
    for (let dr = 0; dr < (d.h || 1); dr++) {
      for (let dc = 0; dc < (d.w || 1); dc++) {
        const c = d.col + dc, r = d.row + dr;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          tileWalkable[r][c] = false;
        }
      }
    }
  }
}

function findPath(startCol, startRow, endCol, endRow) {
  // Clamp to grid bounds
  startCol = Math.max(0, Math.min(COLS - 1, Math.round(startCol)));
  startRow = Math.max(0, Math.min(ROWS - 1, Math.round(startRow)));
  endCol = Math.max(0, Math.min(COLS - 1, Math.round(endCol)));
  endRow = Math.max(0, Math.min(ROWS - 1, Math.round(endRow)));

  if (startCol === endCol && startRow === endRow) return [];
  const key = (c, r) => (c << 16) | r;
  const visited = new Set([key(startCol, startRow)]);
  const parent = new Map();
  const queue = [{col: startCol, row: startRow}];
  const dirs = [{dc:0,dr:-1},{dc:0,dr:1},{dc:-1,dr:0},{dc:1,dr:0}];
  let head = 0;

  while (head < queue.length) {
    const curr = queue[head++];
    if (curr.col === endCol && curr.row === endRow) {
      const path = [];
      let k = key(endCol, endRow);
      const startKey = key(startCol, startRow);
      while (k !== startKey) {
        const c = k >> 16, r = k & 0xFFFF;
        path.unshift({col: c, row: r});
        k = parent.get(k);
      }
      return path;
    }
    for (const d of dirs) {
      const nc = curr.col + d.dc, nr = curr.row + d.dr;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      const nk = key(nc, nr);
      if (visited.has(nk)) continue;
      // Allow walking to destination even if blocked (desk seat)
      if (!tileWalkable[nr][nc] && !(nc === endCol && nr === endRow)) continue;
      visited.add(nk);
      parent.set(nk, key(curr.col, curr.row));
      queue.push({col: nc, row: nr});
    }
  }
  return []; // no path found
}

function randomWalkableTile() {
  const candidates = [];
  for (let r = 2; r < ROWS - 2; r++) {
    for (let c = 2; c < COLS - 2; c++) {
      if (tileWalkable[r][c]) candidates.push({col: c, row: r});
    }
  }
  if (candidates.length === 0) return {col: 3, row: 3};
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function createChar(session, deskCol, deskRow, idx) {
  const seatCol = deskCol + 1;

  return {

    palette: idx % PALETTES.length,
    bodyType: Math.floor(idx / PALETTES.length) % NUM_BODY_TYPES,
    x: seatCol * TILE, y: seatRow * TILE,
    tileCol: seatCol, tileRow: seatRow,
    path: [], moveProgress: 0,
    deskCol, deskRow,
    state: 'type',
    frame: 0, frameTimer: 0,
    wanderTimer: 5 + Math.random() * 15,
    isActive: true,
    currentTool: null,
    bubbleType: null, bubbleTimer: 0,
    matrixEffect: 'spawn', matrixEffectTimer: 0,
    matrixEffectSeeds: Array.from({length: 16}, () => Math.random() * 0.15),
  };
}

function syncCharacters() {
  computeLayout();
  const activeIds = new Set(sessions.map(s => s.id));

  for (const [id, ch] of characters.entries()) {
    if (!activeIds.has(id)) {
      if (ch.matrixEffect === 'despawn') {
        if (ch.matrixEffectTimer >= MATRIX_DURATION) characters.delete(id);
      } else {
        ch.matrixEffect = 'despawn';
        ch.matrixEffectTimer = 0;
        ch.matrixEffectSeeds = Array.from({length: 16}, () => Math.random() * 0.15);
      }
    }
  }

  let globalIdx = 0;
  for (const zone of zones) {
    for (let i = 0; i < zone.agents.length; i++) {
      const s = zone.agents[i];
      const desk = zone.desks[i];
      let ch = characters.get(s.id);
      if (!ch) {
        ch = createChar(s, desk.col, desk.row, globalIdx);
        characters.set(s.id, ch);
      }

      // Update desk (may shift if layout recalculated)
      ch.deskCol = desk.col;
      ch.deskRow = desk.row;
      ch.currentTool = s.currentTool || null;

      const wasActive = ch.isActive;
      ch.isActive = ['working', 'thinking', 'needs_permission'].includes(s.state);

      if (ch.isActive && !wasActive) {
        const seatCol = ch.deskCol + 1, seatRow = ch.deskRow + 2;
        ch.path = findPath(ch.tileCol, ch.tileRow, seatCol, seatRow);
        ch.moveProgress = 0;
        ch.state = ch.path.length > 0 ? 'walk' : 'type';
      }
      if (!ch.isActive && wasActive && ch.state === 'type') {
        ch.state = 'idle';
        ch.wanderTimer = 2 + Math.random() * 5;
      }

      if (s.state === 'needs_permission') {
        ch.bubbleType = 'permission';
        ch.bubbleTimer = 99;
      } else if (s.state === 'needs_input') {
        if (ch.bubbleType !== 'waiting') ch.bubbleTimer = 3;
        ch.bubbleType = 'waiting';
      } else {
        ch.bubbleType = null;
      }

      globalIdx++;
    }
  }
  placeDecorations();
  buildWalkabilityGrid();
}

// ================================================================
// UPDATE
// ================================================================
function update(dt) {
  for (const ch of characters.values()) {
    // Matrix effect takes priority over all other state
    if (ch.matrixEffect) {
      ch.matrixEffectTimer += dt;
      if (ch.matrixEffect === 'spawn' && ch.matrixEffectTimer >= MATRIX_DURATION) {
        ch.matrixEffect = null;
      }
      continue;
    }

    ch.frameTimer += dt;

    if (ch.state === 'type') {
      const isReading = ch.currentTool && READING_TOOLS.has(ch.currentTool);
      const frameDur = isReading ? 0.8 : 0.3;
      if (ch.frameTimer > frameDur) { ch.frameTimer = 0; ch.frame = (ch.frame + 1) % 2; }
      if (!ch.isActive) { ch.state = 'idle'; ch.wanderTimer = 2 + Math.random() * 8; }
    }
    else if (ch.state === 'idle') {
      ch.frame = 0;
      if (ch.isActive) {
        const seatCol = ch.deskCol + 1, seatRow = ch.deskRow + 2;
        ch.path = findPath(ch.tileCol, ch.tileRow, seatCol, seatRow);
        ch.moveProgress = 0;
        ch.state = ch.path.length > 0 ? 'walk' : 'type';
      } else {
        ch.wanderTimer -= dt;
        if (ch.wanderTimer <= 0) {
          const target = randomWalkableTile();
          ch.path = findPath(ch.tileCol, ch.tileRow, target.col, target.row);
          ch.moveProgress = 0;
          if (ch.path.length > 0) ch.state = 'walk';
          ch.wanderTimer = 5 + Math.random() * 20;
        }
      }
    }
    else if (ch.state === 'walk') {
      if (ch.frameTimer > 0.15) { ch.frameTimer = 0; ch.frame = (ch.frame + 1) % 4; }

      if (ch.path.length === 0) {
        ch.x = ch.tileCol * TILE;
        ch.y = ch.tileRow * TILE;
        ch.state = ch.isActive ? 'type' : 'idle';
        ch.frame = 0;
      } else {
        const next = ch.path[0];
        const speed = 3; // tiles per second
        ch.moveProgress += speed * dt;

        const fromX = ch.tileCol * TILE;
        const fromY = ch.tileRow * TILE;
        const toX = next.col * TILE;
        const toY = next.row * TILE;
        const t = Math.min(ch.moveProgress, 1);
        ch.x = fromX + (toX - fromX) * t;
        ch.y = fromY + (toY - fromY) * t;

        if (ch.moveProgress >= 1) {
          ch.tileCol = next.col;
          ch.tileRow = next.row;
          ch.path.shift();
          ch.moveProgress = 0;
        }
      }
    }

    if (ch.bubbleType === 'waiting') {
      ch.bubbleTimer -= dt;
      if (ch.bubbleTimer <= 0) ch.bubbleType = null;
    }
  }
}

// ================================================================
// RENDER
// ================================================================
function render(ctx, w, h) {
  ctx.clearRect(0, 0, w, h);

  const mapW = COLS * TILE * zoom;
  const mapH = ROWS * TILE * zoom;
  const ox = Math.floor((w - mapW) / 2) + panX;
  const oy = Math.floor((h - mapH) / 2) + panY;

  // Checkerboard floor
  const tz = TILE * zoom;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? FLOOR_A : FLOOR_B;
      ctx.fillRect(ox + c * tz, oy + r * tz, tz, tz);
    }
  }

  // Walls — top wall (row 0)
  const wallTopSprite = renderSprite(WALL_TOP, zoom);
  for (let c = 0; c < COLS; c++) {
    ctx.drawImage(wallTopSprite, ox + c * tz, oy);
  }

  // Walls — left wall (col 0)
  const wallSideSprite = renderSprite(WALL_SIDE, zoom);
  for (let r = 1; r < ROWS; r++) {
    ctx.drawImage(wallSideSprite, ox, oy + r * tz);
  }

  // Grid lines (subtle, over floor)
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  for (let c = 1; c < COLS; c++) {
    ctx.beginPath();
    ctx.moveTo(ox + c * tz + 0.5, oy + tz);
    ctx.lineTo(ox + c * tz + 0.5, oy + mapH);
    ctx.stroke();
  }
  for (let r = 1; r < ROWS; r++) {
    ctx.beginPath();
    ctx.moveTo(ox + tz, oy + r * tz + 0.5);
    ctx.lineTo(ox + mapW, oy + r * tz + 0.5);
    ctx.stroke();
  }

  // Draw project zone carpets
  for (const zone of zones) {
    const zx = ox + zone.x * TILE * zoom;
    const zy = oy + zone.y * TILE * zoom;
    const zw = zone.w * TILE * zoom;
    const zh = zone.h * TILE * zoom;

    // Carpet fill
    ctx.fillStyle = zone.color.carpet;
    ctx.fillRect(zx, zy, zw, zh);

    // Carpet border (dashed)
    ctx.strokeStyle = zone.color.border;
    ctx.lineWidth = 2;
    ctx.setLineDash([zoom * 3, zoom * 2]);
    ctx.strokeRect(zx + 1, zy + 1, zw - 2, zh - 2);
    ctx.setLineDash([]);

    // Project label at top of zone
    const labelX = ox + zone.labelCol * TILE * zoom;
    const labelY = oy + zone.labelRow * TILE * zoom;
    ctx.font = `bold ${Math.max(11, zoom * 4)}px Courier New`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const text = zone.project.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const tw = ctx.measureText(text).width;
    // Label background pill
    ctx.fillStyle = 'rgba(10,10,15,0.7)';
    const pillH = Math.max(16, zoom * 5);
    ctx.beginPath();
    ctx.roundRect(labelX - tw / 2 - 8, labelY - pillH / 2, tw + 16, pillH, pillH / 3);
    ctx.fill();
    // Label text
    ctx.fillStyle = zone.color.accent;
    ctx.fillText(text, labelX, labelY);

    // Agent count
    ctx.font = `${Math.max(8, zoom * 2.5)}px Courier New`;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillText(`${zone.agents.length} agent${zone.agents.length !== 1 ? 's' : ''}`, labelX, labelY + pillH / 2 + Math.max(8, zoom * 2));
  }

  // Collect drawables for z-sort
  const drawables = [];

  // Decorations
  for (const d of decorations) {
    const sprite = renderSprite(d.sprite, zoom);
    const dx = ox + d.col * tz;
    const dy = oy + d.row * tz;
    const zY = d.row * TILE + (d.h || 1) * TILE;
    drawables.push({ zY, draw: () => ctx.drawImage(sprite, dx, dy) });
  }

  // Desks + PCs
  for (const ch of characters.values()) {
    const deskSprite = usePngSprites ? renderPngSprite(spriteSheets.desk, zoom) : renderSprite(DESK, zoom);
    const pcSprite = usePngSprites ? renderPngSprite(spriteSheets.pc, zoom) : renderSprite(PC, zoom);
    const dx = ox + ch.deskCol * TILE * zoom;
    const dy = oy + ch.deskRow * TILE * zoom;
    drawables.push({ zY: ch.deskRow * TILE + 32, draw: () => ctx.drawImage(deskSprite, dx, dy) });
    const px = ox + (ch.deskCol + 0.5) * TILE * zoom;
    const py = oy + (ch.deskRow + 0.25) * TILE * zoom;
    drawables.push({ zY: ch.deskRow * TILE + 8, draw: () => ctx.drawImage(pcSprite, px, py) });
  }

  // Characters
  for (const ch of characters.values()) {
    // Matrix effect: render separately
    if (ch.matrixEffect) {
      const capturedCh = ch;
      drawables.push({
        zY: ch.y + TILE / 2,
        draw: () => renderMatrixEffect(ctx, capturedCh, ox, oy, zoom),
      });
      continue;
    }

    let sprite;
    if (usePngSprites) {
      const frameKey = getCharFrameKey(ch);
      sprite = renderCharFrame(ch.palette, ch.bodyType, frameKey, zoom);
    } else {
      const pal = PALETTES[ch.palette];
      const bt = BODY_TYPES[ch.bodyType] || BODY_TYPES[0];
      let tpl;
      if (ch.state === 'type') {
        const isReading = ch.currentTool && READING_TOOLS.has(ch.currentTool);
        tpl = isReading
          ? (ch.frame === 0 ? bt.read1 : bt.read2)
          : (ch.frame === 0 ? bt.type1 : bt.type2);
      } else if (ch.state === 'walk') {
        tpl = [bt.walk1, bt.walk2, bt.walk1, bt.walk2][ch.frame % 4];
      } else {
        tpl = bt.walk2;
      }
      sprite = renderSprite(resolveVariant(tpl, pal), zoom);
    }
    const sittingOff = ch.state === 'type' ? 6 : 0;
    const sx = Math.round(ox + ch.x * zoom - sprite.width / 2);
    const sy = Math.round(oy + (ch.y + sittingOff) * zoom - sprite.height);

    drawables.push({
      zY: ch.y + TILE / 2,
      draw: () => {
        ctx.drawImage(sprite, sx, sy);

        const labelX = ox + ch.x * zoom;
        const labelY = oy + (ch.y + sittingOff - 26) * zoom;
        const session = sessions.find(s => s.id === ch.id);
        if (session) {
          let dotColor = 'transparent';
          if (['needs_input','needs_permission'].includes(session.state)) dotColor = '#ff9e64';
          else if (session.state === 'working') dotColor = '#9ece6a';
          else if (session.state === 'thinking') dotColor = '#7aa2f7';
          else if (session.state === 'completed') dotColor = '#73daca';

          if (dotColor !== 'transparent') {
            ctx.fillStyle = dotColor;
            ctx.beginPath();
            ctx.arc(labelX, labelY - 4, 3 * (zoom / 3), 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.font = `${Math.max(9, zoom * 3)}px Courier New`;
          const text = session.slug || session.id;
          const tw = ctx.measureText(text).width;
          ctx.fillStyle = 'rgba(30,30,46,0.85)';
          ctx.fillRect(labelX - tw / 2 - 3, labelY - 6, tw + 6, Math.max(12, zoom * 4));
          ctx.fillStyle = '#c0caf5';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(text, labelX, labelY - 4);
        }
      }
    });

    if (ch.bubbleType) {
      const bSprite = usePngSprites
        ? renderPngSprite(ch.bubbleType === 'permission' ? spriteSheets.bubble_perm : spriteSheets.bubble_check, zoom)
        : renderSprite(ch.bubbleType === 'permission' ? BUBBLE_PERM : BUBBLE_CHECK, zoom);
      const bx = Math.round(ox + ch.x * zoom - bSprite.width / 2);
      const by = Math.round(oy + (ch.y + sittingOff - 28) * zoom - bSprite.height);
      drawables.push({
        zY: ch.y - 100,
        draw: () => {
          let alpha = 1;
          if (ch.bubbleType === 'waiting' && ch.bubbleTimer < 0.5) alpha = ch.bubbleTimer / 0.5;
          if (alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
          ctx.drawImage(bSprite, bx, by);
          if (alpha < 1) ctx.globalAlpha = 1;
        }
      });
    }
  }

  drawables.sort((a, b) => a.zY - b.zY);
  for (const d of drawables) d.draw();

  // Empty state
  if (zones.length === 0) {
    ctx.fillStyle = '#565f89';
    ctx.font = '16px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('No hay agentes activos', w / 2, h / 2);
    ctx.font = '12px Courier New';
    ctx.fillText('Abre Claude Code en una terminal para comenzar', w / 2, h / 2 + 24);
  }
}

// ================================================================
// GAME LOOP
// ================================================================
const canvas = document.getElementById('c');
const wrap = document.getElementById('canvas-wrap');
let lastTime = 0;

function gameLoop(time) {
  const dt = lastTime === 0 ? 0 : Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;

  const dpr = window.devicePixelRatio || 1;
  const rect = wrap.getBoundingClientRect();
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  update(dt);
  render(ctx, canvas.width, canvas.height);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

};
const STATE_COLORS = {
  needs_input: '#ff9e64', needs_permission: '#ff9e64',
  completed: '#73daca', working: '#9ece6a',
  thinking: '#7aa2f7', offline: '#565f89',
};

function timeAgo(ts) {
  if (!ts) return '';
  const d = Date.now() - new Date(ts).getTime();
  const m = Math.floor(d / 60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h`;
  return `${Math.floor(h/24)}d`;
}

    for (const s of inactive) {

// ================================================================
// PLAN USAGE (claude.ai)
// ================================================================
function timeUntil(isoDate) {
  if (!isoDate) return '';
  const diff = new Date(isoDate).getTime() - Date.now();
  if (diff <= 0) return 'ahora';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 24) return `${Math.floor(h / 24)}d ${h % 24}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function meterColor(pct) {
  if (pct >= 80) return '#f7768e';
  if (pct >= 50) return '#ff9e64';
  if (pct >= 25) return '#e0af68';
  return '#9ece6a';
}

function renderPlanUsage(data) {
  const el = document.getElementById('plan-usage');
  if (!data || data.error) {
    if (data?.error?.includes('Missing')) {
      el.innerHTML = `<div class="plan-title">PLAN CLAUDE.AI</div>
        <div style="font-size:0.65rem;color:#8890b0;padding:8px;">Configura CLAUDE_COOKIE en .env</div>`;
    } else {
      el.innerHTML = '';
    }
    return;
  }

  const meters = [
    { key: 'five_hour', label: 'Limite 5 horas', data: data.five_hour },
    { key: 'seven_day', label: 'Limite 7 dias', data: data.seven_day },
    { key: 'seven_day_sonnet', label: 'Sonnet (7 dias)', data: data.seven_day_sonnet },
    { key: 'seven_day_opus', label: 'Opus (7 dias)', data: data.seven_day_opus },
    { key: 'seven_day_cowork', label: 'Cowork (7 dias)', data: data.seven_day_cowork },
  ];

  let html = `<div class="plan-title">
    PLAN CLAUDE.AI
    <span style="font-size:0.55rem;font-weight:normal;color:#8890b0;">en vivo</span>
  </div>`;

  for (const m of meters) {
    if (!m.data) continue;
    const pct = Math.min(100, Math.round(m.data.utilization));
    const color = meterColor(pct);
    const reset = m.data.resets_at ? `Reset en ${timeUntil(m.data.resets_at)}` : '';
    html += `
      <div class="plan-meter">
        <div class="plan-meter-label">
          <span class="plan-meter-name">${m.label}</span>
          <span class="plan-meter-value" style="color:${color}">${pct}%</span>
        </div>
        <div class="plan-meter-bar">
          <div class="plan-meter-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        ${reset ? `<div class="plan-reset">${reset}</div>` : ''}
      </div>`;
  }

  // Extra usage
  if (data.extra_usage) {
    const eu = data.extra_usage;
    html += `<div style="font-size:0.6rem;color:#8890b0;margin-top:6px;padding:4px 0;border-top:1px solid #24283b;">
      Extra usage: ${eu.is_enabled ? 'Activado' : 'Desactivado'}
      ${eu.used_credits != null ? ` — $${eu.used_credits.toFixed(2)} usado` : ''}
    </div>`;
  }

  el.innerHTML = html;
}

function fetchPlanUsage() {
  fetch('/api/plan-usage').then(r => r.json()).then(renderPlanUsage).catch(() => {});
}
fetchPlanUsage();
setInterval(fetchPlanUsage, 60000);

function focusTerminal(cwd) {
  fetch('/api/focus-terminal', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },

function updateCookie() {
  const cookie = prompt('Pega el cookie de claude.ai (Request Headers → Cookie):');

  fetch('/api/update-cookie', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },

// ================================================================
// NEW AGENT
// ================================================================
function openNewAgentModal() {
  const modal = document.getElementById('newAgentModal');
  modal.classList.add('open');
  document.getElementById('newAgentCustomDir').value = '';
  document.getElementById('newAgentPrompt').value = '';
  // Load projects
  fetch('/api/projects').then(r => r.json()).then(projects => {
    const select = document.getElementById('newAgentProject');
    select.innerHTML = '<option value="">-- Seleccionar proyecto --</option>';
    for (const p of projects) {
      const opt = document.createElement('option');
      opt.value = p.cwd;
      opt.textContent = `${p.project} (${p.cwd.replace(/^\/Users\/[^/]+/, '~')})`;
      select.appendChild(opt);
    }
  }).catch(() => {});
}

function closeNewAgentModal() {
  document.getElementById('newAgentModal').classList.remove('open');
}

function launchNewAgent() {
  const select = document.getElementById('newAgentProject');
  const customDir = document.getElementById('newAgentCustomDir').value.trim();
  const prompt = document.getElementById('newAgentPrompt').value.trim();
  const cwd = customDir || select.value;

  if (!cwd) {
    alert('Selecciona un proyecto o ingresa una ruta');
    return;
  }

  fetch('/api/new-agent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cwd, prompt: prompt || undefined }),
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      closeNewAgentModal();
    } else {
      alert('Error: ' + (data.error || 'desconocido'));
    }
  })
  .catch(() => alert('Error de conexion'));
}

// ================================================================
// NOTIFICATIONS
// ================================================================
function playChime() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const play = (freq, start) => {
      const t = audioCtx.currentTime + start;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.14, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.18);
    };
    play(659.25, 0); play(1318.51, 0.1);
  } catch {}
}

function checkNotifications() {
  for (const s of sessions) {
    const prev = previousStates[s.id];
    if ((s.state === 'needs_input' || s.state === 'needs_permission') && prev !== s.state) {
      playChime();
    }
    previousStates[s.id] = s.state;
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('soundEnabled', soundEnabled);
  const btn = document.getElementById('soundBtn');
  btn.textContent = `Sonido: ${soundEnabled ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active', soundEnabled);
  if (soundEnabled && !audioCtx) audioCtx = new AudioContext();
}

// Restore sound preference
if (localStorage.getItem('soundEnabled') === 'true') {
  soundEnabled = true;
  const btn = document.getElementById('soundBtn');
  btn.textContent = 'Sonido: ON';
  btn.classList.add('active');
}

function changeZoom(d) {
  zoom = Math.max(1, Math.min(8, zoom + d));
  spriteCache.clear();
  pngSpriteCache.clear();
}

// ================================================================
// DATA — WebSocket + polling
// ================================================================
function onData(data) {
  sessions = data;
  syncCharacters();
  checkNotifications();
  renderPanel();
}

function wsConnect() {
  const ws = new WebSocket(`ws://${location.host}`);
  ws.onmessage = e => { try { const d = JSON.parse(e.data); if (d.type==='update') onData(d.sessions); } catch{} };
  ws.onclose = () => setTimeout(wsConnect, 2000);
  ws.onerror = () => ws.close();
}

fetch('/api/sessions').then(r=>r.json()).then(onData).catch(()=>{});
wsConnect();
setInterval(() => fetch('/api/sessions').then(r=>r.json()).then(onData).catch(()=>{}), 5000);

// Pan with mouse drag
let dragging = false, dragStart = { x: 0, y: 0 };
canvas.addEventListener('mousedown', e => { dragging = true; dragStart = { x: e.clientX - panX, y: e.clientY - panY }; });
window.addEventListener('mousemove', e => { if (dragging) { panX = e.clientX - dragStart.x; panY = e.clientY - dragStart.y; } });
window.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('wheel', e => { e.preventDefault(); changeZoom(e.deltaY < 0 ? 1 : -1); }, { passive: false });
</script>
